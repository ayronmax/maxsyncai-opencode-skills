schema: spec-driven

# Contexto do projeto (exibido ao agente ao criar artefatos)
# Substitua os placeholders {{...}} pelos valores reais do seu projeto.
context: |
  Projeto: maxcortex — Plataforma central de orquestração de agentes de IA multi-tenant baseada em LangGraph + DeepAgents com pipeline de segurança de 7 dimensões, PostgreSQL como banco único (fila transacional + checkpointer + store vetorial pgvector), e arquitetura hierárquica Agente Supervisor → Hub de Sub-agentes Plug & Play.

  Tech stack:
    Backend: Python 3.12, FastAPI + LangGraph v1.2+ / DeepAgents v0.7+ + Alembic
    Frontend: TypeScript, Next.js 16 (App Router + React Server Components)
    Banco: PostgreSQL 16 + pgvector (HNSW)
    Infra: Docker Compose (5 serviços: db, api, worker, admin_panel), Prometheus + Grafana, HashiCorp Vault, nginx/traefik
    Package managers: uv, npm

  Testes/lint:
    - pytest (backend) / vitest (frontend)
    - ruff (backend) / eslint (frontend)
    - Makefile como interface principal: make test, make lint, make check

  Convenções:
    - Fluxo de trabalho: OpenSpec em 6 fases (explore → propose → apply →
      verify → PR → archive) conforme `AGENTS.md`
    - Mudanças de tooling/docs sem mudança de produto declaram skip_specs
    - Commit: Conventional Commits (pt-BR); nunca direto na main
    - Push seguro via `./scripts/push-safe.sh` antes do push
    - Idioma: código em inglês; artefatos OpenSpec e documentação interna em
      pt-BR; PRs em pt-BR

  Regras específicas do projeto:
    - Testes de integração NUNCA paralelizados (PostgreSQL compartilhado)
    - NUNCA usar `asyncio.sleep()` com tempo real em testes
    - PII Shield opera via `wrap_model_call`/`after_model` (DeepAgents hooks)
    - Business Nomenclature Shield opera ANTES do PII Shield no `wrap_model_call`
    - Ferramentas RAG/DB implementam `NomenclatureAwareMixin` — nunca aplicam PII Shield
    - Embeddings: `text-embedding-3-small`, 1536 dims, distância cosseno
    - Streaming: SSE primário, WebSocket como upgrade
    - Alembic para migrações; LangGraph tables via `checkpointer.setup()`/`store.setup()`

rules:
  proposal:
    - Sempre incluir seção "Why", "What Changes", "Impact" e "Capabilities"
    - >-
      Cada capability listada no proposal.md DEVE ter um spec delta
      correspondente em specs/<capability>/spec.md, a menos que o .openspec.yaml
      declare skip_specs: true
    - Indicar arquivos/áreas afetadas no Impact
  design:
    - Incluir seção "Decisions" com alternativas consideradas e racional
    - Incluir "Risks / Trade-offs" com mitigações
    - Incluir "Migration Plan" quando houver remoção/migração de tooling
    - Incluir seção "## Open Questions" com formato `Q | Owner | Spike/Research
      | Status | Resolvido em`. Mesmo que "Nenhuma em aberto" como placeholder
      (preserva auditabilidade — o instruction do artifact `tasks` do package
      OpenSpec procura essa seção; não criá-la é bug latente).
  tasks:
    - Quebrar em chunks de no máximo 2 horas
    - "Últimas tasks de cada change (sequência obrigatória): validação (`openspec validate`, `make lint`, `make test-backend-fast`, `push-safe.sh`) → `/opsx-verify-change` → commit + `git push -u origin feature/<change>` → `gh pr create` (base main, head feature, body pt-BR) → GATE 4 (aguardar merge humano) → `./scripts/close-change.sh <change>` após merge. Nunca archivar sem merge confirmado."
    - >-
      Antes de submeter tasks, validar Open Questions do design (instruction
      do artifact tasks do package exige: "check design.md for Open Questions.
      If any of them would change what gets built, resolve them with the user
      first"). Não cozinhe suposição implícita no task list.
    - "Tipo Spike: - [ ] X.Y Spike: <pergunta> → decision em <arquivo>. Spike
      preserva natureza exploratória (não é task de implementação direta)."
    - Indicar arquivos afetados por task quando relevante
  closeout:
    - >-
      Antes de rodar close-change.sh, criar a nota "Decisões Técnicas — <change>"
      no Basic Memory via basic-memory_write_note com overwrite: true e directory: "/"
    - >-
      Se a change tem spec deltas (skip_specs != true em .openspec.yaml e
      specs/ não vazio), a nota DEVE incluir relações
      "implements: \`<capability>\` (openspec/specs/<capability>/spec.md)"
      para cada spec delta presente. Use code-formatting (\`...\`) em vez de
      wiki links — specs são arquivos git, não notas do Basic Memory.
    - Manter o índice central do projeto (nome em CAIXA ALTA) na raiz do
      Basic Memory com wiki links [[...]] para todas as decisões técnicas

